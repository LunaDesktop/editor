[package]
name = "luna-editor"
version = "0.2.3"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.80"
authors = ["Patryk Szkudlarek / libLuna contributors"]
description = "Luna Editor — lekki edytor tekstu i kodu z podświetlaniem składni (libLuna, bez GTK)."

[workspace]
resolver = "2"

[dependencies]
libluna-core = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-i18n = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-render = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-platform = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
libluna-widgets = { git = "https://github.com/LunaDesktop/libLuna.git", version = "0.0.9" }
serde_json = "1.0"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
